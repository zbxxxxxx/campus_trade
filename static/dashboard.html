<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 校园二手交易平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">
                <span>🎓</span>
                <span>CampusTrade</span>
            </a>
            
            <div class="navbar-nav" id="auth-nav">
                <!-- 动态生成 -->
            </div>
        </div>
    </nav>
    
    <!-- 用户中心 -->
    <main class="dashboard-layout">
        <!-- 侧边栏 -->
        <aside class="dashboard-sidebar">
            <div style="text-align: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border);">
                <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; margin: 0 auto 15px;" id="user-avatar">
                    U
                </div>
                <h3 id="user-name" style="font-size: 18px; margin-bottom: 5px;">用户名</h3>
                <p id="user-email" style="font-size: 13px; color: var(--text-secondary);">email@example.com</p>
            </div>
            
            <ul class="sidebar-menu">
                <li>
                    <a href="#" class="active" onclick="switchTab('items')">
                        <span>📦</span> 我的商品
                    </a>
                </li>
                <li>
                    <a href="#" onclick="switchTab('orders')">
                        <span>🛒</span> 我的订单
                    </a>
                </li>
                <li>
                    <a href="#" onclick="switchTab('profile')">
                        <span>👤</span> 个人资料
                    </a>
                </li>
            </ul>
        </aside>
        
        <!-- 内容区 -->
        <div class="dashboard-content" id="dashboard-content">
            <!-- 动态生成 -->
        </div>
    </main>
    
    <!-- 编辑资料弹窗 -->
    <div class="modal-overlay" id="profile-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">编辑资料</h3>
                <button class="modal-close" onclick="closeModal('profile-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="edit-username">用户名</label>
                    <input type="text" id="edit-username" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="edit-phone">手机号</label>
                    <input type="tel" id="edit-phone" class="form-input">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('profile-modal')">取消</button>
                <button class="btn btn-primary" id="save-profile-btn" onclick="saveProfile()">保存</button>
            </div>
        </div>
    </div>
    
    <!-- 下架商品弹窗 -->
    <div class="modal-overlay" id="deactivate-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">下架商品</h3>
                <button class="modal-close" onclick="closeModal('deactivate-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <p>确定要下架这个商品吗？下架后商品将不会在商城中显示。</p>
                <input type="hidden" id="deactivate-item-id">
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('deactivate-modal')">取消</button>
                <button class="btn btn-danger" id="confirm-deactivate-btn" onclick="confirmDeactivate()">确定下架</button>
            </div>
        </div>
    </div>
    
    <!-- 上架商品弹窗 -->
    <div class="modal-overlay" id="activate-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">重新上架</h3>
                <button class="modal-close" onclick="closeModal('activate-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <p>确定要重新上架这个商品吗？上架后商品将在商城中显示。</p>
                <input type="hidden" id="activate-item-id">
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('activate-modal')">取消</button>
                <button class="btn btn-primary" id="confirm-activate-btn" onclick="confirmActivate()">确定上架</button>
            </div>
        </div>
    </div>
    
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        let currentUser = null;
        let myItems = [];
        let myOrders = [];
        let currentTab = 'items';
        
        // 检查登录
        if (!API.isLoggedIn()) {
            Utils.redirectToLogin();
        }
        
        // 切换标签
        function switchTab(tab) {
            currentTab = tab;
            
            // 更新侧边栏选中状态
            document.querySelectorAll('.sidebar-menu a').forEach(a => {
                a.classList.remove('active');
            });
            event.target.closest('a').classList.add('active');
            
            renderContent();
        }
        
        // 渲染内容
        async function renderContent() {
            const container = document.getElementById('dashboard-content');
            
            switch (currentTab) {
                case 'items':
                    await renderItemsTab(container);
                    break;
                case 'orders':
                    await renderOrdersTab(container);
                    break;
                case 'profile':
                    renderProfileTab(container);
                    break;
            }
        }
        
        // 渲染我的商品
        async function renderItemsTab(container) {
            container.innerHTML = `
                <h2 class="dashboard-title">我的商品</h2>
                <div style="margin-bottom: 20px;">
                    <a href="/post-item.html" class="btn btn-primary">发布新商品</a>
                </div>
                <div id="items-list">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            `;
            
            try {
                myItems = await API.getMyItems();
                const itemsList = document.getElementById('items-list');
                
                if (myItems.length === 0) {
                    itemsList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📦</div>
                            <h3 class="empty-title">还没有发布商品</h3>
                            <p class="empty-desc">快来发布你的第一个商品吧！</p>
                            <a href="/post-item.html" class="btn btn-primary">发布商品</a>
                        </div>
                    `;
                    return;
                }
                
                itemsList.innerHTML = `
                    <div style="overflow-x: auto;">
                        <table style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr style="border-bottom: 2px solid var(--border);">
                                    <th style="padding: 12px; text-align: left;">商品</th>
                                    <th style="padding: 12px; text-align: left;">价格</th>
                                    <th style="padding: 12px; text-align: left;">状态</th>
                                    <th style="padding: 12px; text-align: left;">发布时间</th>
                                    <th style="padding: 12px; text-align: right;">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${myItems.map(item => `
                                    <tr style="border-bottom: 1px solid var(--border);">
                                        <td style="padding: 12px;">
                                            <div style="display: flex; align-items: center; gap: 12px;">
                                                <img src="${item.image_url || 'https://via.placeholder.com/60x60?text=暂无'}" 
                                                     style="width: 60px; height: 60px; border-radius: 8px; object-fit: cover;"
                                                     onerror="this.src='https://via.placeholder.com/60x60?text=暂无'">
                                                <span style="font-weight: 500; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                                    ${item.title}
                                                </span>
                                            </div>
                                        </td>
                                        <td style="padding: 12px; font-weight: 600; color: var(--secondary);">
                                            ${Utils.formatPrice(item.price)}
                                        </td>
                                        <td style="padding: 12px;">
                                            <span style="padding: 4px 12px; border-radius: 20px; font-size: 12px;
                                                ${item.status === 'active' ? 'background: #D1FAE5; color: #059669;' : 
                                                  item.status === 'sold' ? 'background: #FEE2E2; color: #DC2626;' : 
                                                  'background: #FEF3C7; color: #D97706;'}">
                                                ${item.status === 'active' ? '在售' : item.status === 'sold' ? '已售出' : '已下架'}
                                            </span>
                                        </td>
                                        <td style="padding: 12px; color: var(--text-secondary);">
                                            ${Utils.formatTime(item.created_at)}
                                        </td>
                                        <td style="padding: 12px; text-align: right;">
                                            <a href="/product.html?id=${item.id}" class="btn btn-sm btn-outline" style="margin-right: 8px;">查看</a>
                                            ${item.status === 'active' ? `
                                                <a href="/post-item.html?edit=${item.id}" class="btn btn-sm btn-outline" style="margin-right: 8px;">编辑</a>
                                                <button class="btn btn-sm btn-danger" onclick="showDeactivateModal(${item.id})">下架</button>
                                            ` : ''}
                                            ${item.status !== 'active' && item.status !== 'sold' ? `
                                                <button class="btn btn-sm btn-primary" onclick="showActivateModal(${item.id})">重新上架</button>
                                            ` : ''}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                
            } catch (e) {
                console.error('加载商品失败:', e);
                document.getElementById('items-list').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <h3 class="empty-title">加载失败</h3>
                        <button class="btn btn-primary" onclick="renderItemsTab(document.getElementById('dashboard-content'))">重试</button>
                    </div>
                `;
            }
        }
        
        // 渲染我的订单
        async function renderOrdersTab(container) {
            container.innerHTML = `
                <h2 class="dashboard-title">我的订单</h2>
                <div id="orders-list">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            `;
            
            try {
                myOrders = await API.getMyOrders();
                const ordersList = document.getElementById('orders-list');
                
                if (myOrders.length === 0) {
                    ordersList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">🛒</div>
                            <h3 class="empty-title">还没有订单</h3>
                            <p class="empty-desc">快去挑选喜欢的商品吧！</p>
                            <a href="/" class="btn btn-primary">浏览商品</a>
                        </div>
                    `;
                    return;
                }
                
                ordersList.innerHTML = `
                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        ${myOrders.map(order => `
                            <div style="border: 1px solid var(--border); border-radius: 12px; padding: 20px;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border);">
                                    <div>
                                        <span style="font-weight: 600;">订单号：${order.id}</span>
                                        <span style="color: var(--text-secondary); margin-left: 15px;">
                                            ${Utils.formatTime(order.created_at)}
                                        </span>
                                    </div>
                                    <span style="padding: 4px 12px; border-radius: 20px; font-size: 12px;
                                        ${order.status === 'pending' ? 'background: #FEF3C7; color: #D97706;' : 
                                          order.status === 'completed' ? 'background: #D1FAE5; color: #059669;' : 
                                          'background: #FEE2E2; color: #DC2626;'}">
                                        ${order.status === 'pending' ? '待处理' : order.status === 'completed' ? '已完成' : '已取消'}
                                    </span>
                                </div>
                                <div style="display: flex; gap: 20px;">
                                    <img src="${order.item.image_url || 'https://via.placeholder.com/100x100?text=暂无'}" 
                                         style="width: 100px; height: 100px; border-radius: 8px; object-fit: cover;"
                                         onerror="this.src='https://via.placeholder.com/100x100?text=暂无'">
                                    <div style="flex: 1;">
                                        <h4 style="margin-bottom: 8px;">${order.item.title}</h4>
                                        <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 8px;">
                                            卖家：${order.item.seller.username}
                                        </p>
                                        <p style="color: var(--text-secondary); font-size: 14px;">
                                            ${order.remark || '无备注'}
                                        </p>
                                    </div>
                                    <div style="text-align: right;">
                                        <div style="font-size: 24px; font-weight: 700; color: var(--secondary);">
                                            ${Utils.formatPrice(order.total_amount)}
                                        </div>
                                        <a href="/product.html?id=${order.item.id}" class="btn btn-sm btn-outline" style="margin-top: 10px;">
                                            查看商品
                                        </a>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                
            } catch (e) {
                console.error('加载订单失败:', e);
                document.getElementById('orders-list').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <h3 class="empty-title">加载失败</h3>
                        <button class="btn btn-primary" onclick="renderOrdersTab(document.getElementById('dashboard-content'))">重试</button>
                    </div>
                `;
            }
        }
        
        // 渲染个人资料
        function renderProfileTab(container) {
            container.innerHTML = `
                <h2 class="dashboard-title">个人资料</h2>
                <div style="max-width: 500px;">
                    <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
                        <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700;">
                            ${currentUser.username.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <h3 style="font-size: 20px;">${currentUser.username}</h3>
                            <p style="color: var(--text-secondary);">${currentUser.email}</p>
                        </div>
                    </div>
                    
                    <div style="background: var(--background); border-radius: 12px; padding: 20px; margin-bottom: 20px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border);">
                            <span style="color: var(--text-secondary);">用户名</span>
                            <span style="font-weight: 500;">${currentUser.username}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border);">
                            <span style="color: var(--text-secondary);">邮箱</span>
                            <span style="font-weight: 500;">${currentUser.email}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0;">
                            <span style="color: var(--text-secondary);">手机号</span>
                            <span style="font-weight: 500;">${currentUser.phone || '未设置'}</span>
                        </div>
                    </div>
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; color: var(--text-secondary);">
                        <span>注册时间</span>
                        <span>${new Date(currentUser.created_at).toLocaleDateString('zh-CN')}</span>
                    </div>
                    
                    <button class="btn btn-primary" style="margin-top: 20px;" onclick="openEditProfile()">
                        编辑资料
                    </button>
                </div>
            `;
        }
        
        // 打开编辑资料弹窗
        function openEditProfile() {
            document.getElementById('edit-username').value = currentUser.username;
            document.getElementById('edit-phone').value = currentUser.phone || '';
            openModal('profile-modal');
        }
        
        // 保存资料
        async function saveProfile() {
            const username = document.getElementById('edit-username').value.trim();
            const phone = document.getElementById('edit-phone').value.trim();
            const btn = document.getElementById('save-profile-btn');
            
            if (!username) {
                Utils.showToast('用户名不能为空', 'error');
                return;
            }
            
            if (username.length < 3) {
                Utils.showToast('用户名至少需要3个字符', 'error');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '保存中...';
            
            try {
                await API.updateProfile({ username, phone });
                
                Utils.showToast('保存成功！', 'success');
                closeModal('profile-modal');
                
                // 刷新用户信息
                currentUser = await API.getCurrentUser();
                localStorage.setItem('user', JSON.stringify(currentUser));
                
                // 更新显示
                document.getElementById('user-name').textContent = currentUser.username;
                document.getElementById('user-email').textContent = currentUser.email;
                document.getElementById('user-avatar').textContent = currentUser.username.charAt(0).toUpperCase();
                
                renderContent();
                
            } catch (e) {
                console.error('保存失败:', e);
                Utils.showToast(e.message, 'error');
                btn.disabled = false;
                btn.textContent = '保存';
            }
        }
        
        // 显示下架确认弹窗
        function showDeactivateModal(itemId) {
            document.getElementById('deactivate-item-id').value = itemId;
            openModal('deactivate-modal');
        }
        
        // 确认下架商品
        async function confirmDeactivate() {
            const itemId = document.getElementById('deactivate-item-id').value;
            const btn = document.getElementById('confirm-deactivate-btn');
            
            btn.disabled = true;
            btn.textContent = '下架中...';
            
            try {
                await API.updateItemStatus(itemId, 'inactive');
                
                Utils.showToast('商品已下架！', 'success');
                closeModal('deactivate-modal');
                
                // 重新加载商品列表
                await renderItemsTab(document.getElementById('dashboard-content'));
                
            } catch (e) {
                console.error('下架失败:', e);
                Utils.showToast(e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '确定下架';
            }
        }
        
        // 显示重新上架确认弹窗
        function showActivateModal(itemId) {
            document.getElementById('activate-item-id').value = itemId;
            openModal('activate-modal');
        }
        
        // 确认重新上架
        async function confirmActivate() {
            const itemId = document.getElementById('activate-item-id').value;
            const btn = document.getElementById('confirm-activate-btn');
            
            btn.disabled = true;
            btn.textContent = '上架中...';
            
            try {
                await API.updateItemStatus(itemId, 'active');
                
                Utils.showToast('商品已重新上架！', 'success');
                closeModal('activate-modal');
                
                // 重新加载商品列表
                await renderItemsTab(document.getElementById('dashboard-content'));
                
            } catch (e) {
                console.error('上架失败:', e);
                Utils.showToast(e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '确定上架';
            }
        }
        
        // 打开弹窗
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }
        
        // 关闭弹窗
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        
        // 页面加载
        document.addEventListener('DOMContentLoaded', async () => {
            await updateNavbarAuth();
            
            currentUser = getCurrentUser();
            if (!currentUser) {
                currentUser = await API.getCurrentUser();
                localStorage.setItem('user', JSON.stringify(currentUser));
            }
            
            // 更新侧边栏用户信息
            document.getElementById('user-name').textContent = currentUser.username;
            document.getElementById('user-email').textContent = currentUser.email;
            document.getElementById('user-avatar').textContent = currentUser.username.charAt(0).toUpperCase();
            
            // 根据URL参数切换标签
            const tab = Utils.getUrlParam('tab');
            if (tab) {
                switchTab(tab);
            } else {
                await renderContent();
            }
        });
    </script>
</body>
</html>
