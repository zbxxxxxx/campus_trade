<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息 - 校园二手交易平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">
                <span>🎓</span>
                <span>CampusTrade</span>
            </a>
            
            <div class="navbar-nav" id="auth-nav">
                <!-- 动态生成 -->
            </div>
        </div>
    </nav>
    
    <!-- 聊天界面 -->
    <main class="chat-container" id="chat-container">
        <div class="chat-list">
            <div class="chat-list-header">
                消息列表
            </div>
            <div class="chat-list-items" id="chat-list">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
        
        <div class="chat-main">
            <div class="chat-header" id="chat-header">
                请选择对话
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="empty-state">
                    <div class="empty-icon">💬</div>
                    <h3 class="empty-title">暂无消息</h3>
                    <p class="empty-desc">选择左侧对话或开始新聊天</p>
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="message-input" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
                <button class="btn btn-primary" onclick="sendChatMessage()">发送</button>
            </div>
        </div>
    </main>
    
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        let messages = [];
        let selectedConversation = null;
        let messageInterval = null;
        
        // 检查登录
        if (!API.isLoggedIn()) {
            Utils.redirectToLogin();
        }
        
        // 加载消息列表
        async function loadMessages() {
            try {
                const data = await API.getMyMessages();
                messages = data.messages || [];
                renderChatList();
            } catch (e) {
                console.error('加载消息失败:', e);
            }
        }
        
        // 渲染聊天列表
        function renderChatList() {
            const container = document.getElementById('chat-list');
            
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding: 40px 20px;">
                        <div class="empty-icon">💬</div>
                        <h3 class="empty-title">暂无消息</h3>
                    </div>
                `;
                return;
            }
            
            // 按对话分组
            const conversations = {};
            messages.forEach(msg => {
                const otherUser = msg.sender.id === getCurrentUser().id ? msg.receiver : msg.sender;
                const key = otherUser.id;
                
                if (!conversations[key]) {
                    conversations[key] = {
                        user: otherUser,
                        lastMessage: msg,
                        unread: 0
                    };
                }
                
                if (!msg.is_read && msg.receiver.id === getCurrentUser().id) {
                    conversations[key].unread++;
                }
            });
            
            // 转换为数组并排序
            const sortedConversations = Object.values(conversations).sort((a, b) => {
                return new Date(b.lastMessage.created_at) - new Date(a.lastMessage.created_at);
            });
            
            container.innerHTML = sortedConversations.map(conv => `
                <div class="chat-list-item ${selectedConversation === conv.user.id ? 'active' : ''}" 
                     onclick="selectConversation(${conv.user.id}, '${conv.user.username}')">
                    <div class="chat-avatar">${conv.user.username.charAt(0).toUpperCase()}</div>
                    <div class="chat-item-info">
                        <div class="chat-item-name">${conv.user.username}</div>
                        <div class="chat-item-preview">${conv.lastMessage.content}</div>
                    </div>
                    ${conv.unread > 0 ? `<span class="nav-badge">${conv.unread}</span>` : ''}
                </div>
            `).join('');
        }
        
        // 选择对话
        function selectConversation(userId, username) {
            selectedConversation = userId;
            
            // 更新UI
            document.getElementById('chat-header').textContent = username;
            document.querySelectorAll('.chat-list-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // 查找并设置active
            const items = document.querySelectorAll('.chat-list-item');
            items.forEach(item => {
                if (item.onclick.toString().includes(`(${userId},`)) {
                    item.classList.add('active');
                }
            });
            
            // 加载对话消息
            loadConversationMessages(userId);
            
            // 停止轮询
            if (messageInterval) {
                clearInterval(messageInterval);
            }
            
            // 开始轮询新消息
            messageInterval = setInterval(() => {
                if (selectedConversation) {
                    loadConversationMessages(selectedConversation, true);
                }
            }, 3000);
        }
        
        // 加载对话消息
        async function loadConversationMessages(userId, isPolling = false) {
            const container = document.getElementById('chat-messages');
            
            // 过滤当前对话的消息
            const conversationMessages = messages.filter(msg => {
                return (msg.sender.id === userId && msg.receiver.id === getCurrentUser().id) ||
                       (msg.sender.id === getCurrentUser().id && msg.receiver.id === userId);
            });
            
            if (conversationMessages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">💬</div>
                        <h3 class="empty-title">开始聊天吧</h3>
                        <p class="empty-desc">发送第一条消息</p>
                    </div>
                `;
                return;
            }
            
            // 按时间排序
            conversationMessages.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            
            const currentUserId = getCurrentUser().id;
            
            container.innerHTML = conversationMessages.map(msg => {
                const isSent = msg.sender.id === currentUserId;
                return `
                    <div class="chat-message ${isSent ? 'sent' : 'received'}">
                        <div>${msg.content}</div>
                        <div class="chat-message-time">${Utils.formatTime(msg.created_at)}</div>
                    </div>
                `;
            }).join('');
            
            // 滚动到底部
            container.scrollTop = container.scrollHeight;
            
            // 标记已读
            if (!isPolling) {
                conversationMessages.forEach(msg => {
                    if (!msg.is_read && msg.receiver.id === currentUserId) {
                        API.markMessageAsRead(msg.id);
                    }
                });
            }
        }
        
        // 发送消息
        async function sendChatMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            
            if (!content) {
                Utils.showToast('请输入消息内容', 'error');
                return;
            }
            
            if (!selectedConversation) {
                Utils.showToast('请先选择一个对话', 'error');
                return;
            }
            
            input.value = '';
            
            try {
                await API.sendMessage(selectedConversation, content);
                
                // 刷新消息列表
                await loadMessages();
                loadConversationMessages(selectedConversation, true);
                
            } catch (e) {
                console.error('发送失败:', e);
                Utils.showToast(e.message, 'error');
            }
        }
        
        // 回车发送
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendChatMessage();
            }
        }
        
        // 页面加载
        document.addEventListener('DOMContentLoaded', async () => {
            await updateNavbarAuth();
            await loadMessages();
            
            // 检查URL参数中的用户ID（从商品页跳转）
            const toUserId = Utils.getUrlParam('to');
            if (toUserId) {
                const user = await fetch(`/api/users/${toUserId}`).then(r => r.json()).catch(() => null);
                if (user) {
                    selectConversation(user.id, user.username);
                }
            }
            
            // 定时刷新消息
            setInterval(loadMessages, 10000);
        });
        
        // 页面离开时清除轮询
        window.addEventListener('beforeunload', () => {
            if (messageInterval) {
                clearInterval(messageInterval);
            }
        });
    </script>
</body>
</html>
