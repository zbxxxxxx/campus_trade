<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布商品 - 校园二手交易平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">
                <span>🎓</span>
                <span>CampusTrade</span>
            </a>
            
            <div class="navbar-nav" id="auth-nav">
                <!-- 动态生成 -->
            </div>
        </div>
    </nav>
    
    <!-- 发布表单 -->
    <main class="post-form-container">
        <div class="post-form">
            <h2 id="form-title">发布商品</h2>
            
            <form id="item-form">
                <!-- 图片上传 -->
                <div class="form-group">
                    <label class="form-label">商品图片</label>
                    <label class="image-upload" id="image-upload-area">
                        <input type="file" id="image-input" accept="image/*" onchange="handleImagePreview(this)">
                        <div class="image-upload-icon">📷</div>
                        <p>点击上传图片（支持JPG、PNG、GIF，最大5MB）</p>
                        <div class="image-preview" id="image-preview"></div>
                    </label>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="title">商品名称 *</label>
                    <input 
                        type="text" 
                        id="title" 
                        class="form-input" 
                        placeholder="简洁明了的商品名称"
                        required
                        maxlength="100"
                    >
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="category">分类 *</label>
                    <select id="category" class="form-select" required>
                        <option value="">请选择分类</option>
                        <option value="electronics">📱 电子产品</option>
                        <option value="books">📚 图书教材</option>
                        <option value="clothing">👕 服饰鞋包</option>
                        <option value="furniture">🪑 家具家居</option>
                        <option value="sports">⚽ 运动器材</option>
                        <option value="beauty">💄 美妆个护</option>
                        <option value="food">🍎 食品保健</option>
                        <option value="other">📦 其他</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="condition">成色 *</label>
                    <select id="condition" class="form-select" required>
                        <option value="全新">全新</option>
                        <option value="几乎全新">几乎全新</option>
                        <option value="良好" selected>良好</option>
                        <option value="一般">一般</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="price">价格 (元) *</label>
                    <input 
                        type="number" 
                        id="price" 
                        class="form-input" 
                        placeholder="请输入价格"
                        required
                        min="0"
                        step="0.01"
                    >
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="description">商品描述 *</label>
                    <textarea 
                        id="description" 
                        class="form-textarea" 
                        placeholder="详细描述商品的新旧程度、使用情况、交易方式等，让买家更了解商品"
                        required
                        maxlength="2000"
                        rows="5"
                    ></textarea>
                </div>
                
                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button type="button" class="btn btn-outline btn-lg" onclick="window.history.back()">
                        取消
                    </button>
                    <button type="submit" class="btn btn-primary btn-lg" style="flex: 1;" id="submit-btn">
                        发布商品
                    </button>
                </div>
            </form>
        </div>
    </main>
    
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        let editItemId = null;
        let editItemData = null;
        
        // 检查登录状态
        if (!API.isLoggedIn()) {
            Utils.redirectToLogin();
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', async () => {
            await updateNavbarAuth();
            
            // 检查是否是编辑模式
            editItemId = Utils.getUrlParam('edit');
            if (editItemId) {
                await loadEditItem();
            }
        });
        
        // 加载编辑商品
        async function loadEditItem() {
            try {
                const data = await API.getItem(editItemId);
                const user = getCurrentUser();
                
                if (data.seller.id !== user.id) {
                    Utils.showToast('无权编辑此商品', 'error');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html?tab=items';
                    }, 1000);
                    return;
                }
                
                editItemData = data;
                
                // 更新表单标题
                document.getElementById('form-title').textContent = '编辑商品';
                document.getElementById('submit-btn').textContent = '保存修改';
                
                // 填充表单
                document.getElementById('title').value = data.title;
                document.getElementById('category').value = data.category;
                document.getElementById('condition').value = data.condition;
                document.getElementById('price').value = data.price;
                document.getElementById('description').value = data.description;
                
                // 显示已有图片
                if (data.image_url) {
                    document.getElementById('image-preview').innerHTML = `
                        <img src="${data.image_url}" alt="商品图片" onerror="this.src='https://via.placeholder.com/100x100?text=图片'">
                    `;
                }
                
            } catch (e) {
                console.error('加载商品失败:', e);
                Utils.showToast('商品不存在或已被删除', 'error');
                setTimeout(() => {
                    window.location.href = '/dashboard.html?tab=items';
                }, 1000);
            }
        }
        
        // 处理图片预览
        function handleImagePreview(input) {
            Utils.handleImageUpload(input, document.getElementById('image-preview'));
        }
        
        // 表单提交
        document.getElementById('item-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const condition = document.getElementById('condition').value;
            const price = parseFloat(document.getElementById('price').value);
            const description = document.getElementById('description').value.trim();
            const imageInput = document.getElementById('image-input');
            
            // 验证
            if (!title || !category || !price || !description) {
                Utils.showToast('请填写所有必填项', 'error');
                return;
            }
            
            if (price < 0) {
                Utils.showToast('价格不能为负数', 'error');
                return;
            }
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = editItemId ? '保存中...' : '发布中...';
            
            try {
                const formData = new FormData();
                formData.append('title', title);
                formData.append('category', category);
                formData.append('condition', condition);
                formData.append('price', price);
                formData.append('description', description);
                
                if (imageInput.files[0]) {
                    formData.append('image', imageInput.files[0]);
                }
                
                if (editItemId) {
                    // 编辑模式
                    await API.updateItem(editItemId, formData);
                    Utils.showToast('修改成功！', 'success');
                } else {
                    // 新增模式
                    await API.createItem(formData);
                    Utils.showToast('发布成功！', 'success');
                }
                
                setTimeout(() => {
                    window.location.href = '/dashboard.html?tab=items';
                }, 1500);
                
            } catch (e) {
                console.error('提交失败:', e);
                Utils.showToast(e.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = editItemId ? '保存修改' : '发布商品';
            }
        });
    </script>
</body>
</html>
